databases:
  - name: oems-postgres
    databaseName: oems
    user: oems_user
    region: frankfurt
    plan: basic-256mb

services:
  - type: web
    name: oems-api
    runtime: node
    rootDir: backend
    region: frankfurt
    plan: starter
    buildCommand: npm install
    preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oems-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: School Administrator
      - key: CORS_ORIGINS
        value: https://tarakadidata-wq.github.io,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false
